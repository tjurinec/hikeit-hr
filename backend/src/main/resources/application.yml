spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/vrhiput
    username: vrhiput
    password: vrhiput123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080

app:
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket: ${R2_BUCKET:hikeit}
    public-url: ${R2_PUBLIC_URL:}
  cors:
    allowed-origins: http://localhost:5173
